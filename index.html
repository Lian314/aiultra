<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <script>
    (() => {
      let theme = '';
      try { theme = localStorage.getItem('minimal-ai-chat.theme.v1') || ''; } catch {}
      const manual = theme === 'light' || theme === 'dark';
      if (!manual) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themeSource = manual ? 'manual' : 'system';
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#131714' : '#f5f6f3';
    })();
  </script>
  <title>AI 对话</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f6f3;
      --panel: #fff;
      --sidebar: #eff1ed;
      --line: #e2e6df;
      --line-strong: #d3d9d0;
      --ink: #242a25;
      --muted: #778078;
      --accent: #477353;
      --accent-hover: #3b6346;
      --accent-action: #477353;
      --accent-action-hover: #3b6346;
      --accent-soft: #e7efe8;
      --danger: #b44842;
      --shadow: 0 18px 60px rgb(31 43 33 / 16%);
      --thread-muted: #505a51;
      --thread-active: #e2e7e0;
      --hover: rgb(255 255 255 / 65%);
      --surface-raised: #f0f2ef;
      --surface-code: #f3f5f2;
      --user-border: #dbe6dc;
      --user-ink: #27342a;
      --assistant-ink: #353c36;
      --field-label: #606a61;
      --field-hint: #89928a;
      --placeholder: #9aa29a;
      --focus-border: #83a289;
      --focus-ring: rgb(71 115 83 / 9%);
      --composer-focus-border: #9db5a0;
      --composer-focus-ring: rgb(71 115 83 / 8%);
      --button-surface: #fff;
      --button-ink: #59635a;
      --settings-ink: #4c554d;
      --icon-ink: #637066;
      --error-surface: #fff6f4;
      --error-border: #eed1cd;
      --modal-backdrop: rgb(22 29 23 / 35%);
      --modal-border: rgb(255 255 255 / 70%);
      --modal-footer: #fbfcfa;
      --toast-surface: #fff;
      --toast-ink: #465047;
      --topbar-surface: rgb(255 255 255 / 55%);
      --composer-shadow: 0 3px 14px rgb(36 46 36 / 4%);
      --toast-shadow: 0 8px 24px rgb(20 30 20 / 12%);
      --sidebar-shadow: 12px 0 32px rgb(20 30 20 / 10%);
      --scrim: rgb(22 29 23 / 28%);
      --status-offline: #aeb6ad;
      --status-online: #48a269;
      --status-busy: #d69b3c;
      --stop-background: #68746a;
      --disabled-opacity: .48;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #131714;
      --panel: #1d231e;
      --sidebar: #181d19;
      --line: #2d352f;
      --line-strong: #414a43;
      --ink: #e5ebe5;
      --muted: #9eaaa0;
      --accent: #9bc6a0;
      --accent-hover: #b1d3b5;
      --accent-action: #477353;
      --accent-action-hover: #578460;
      --accent-soft: #29382c;
      --danger: #f0928b;
      --shadow: 0 18px 60px rgb(0 0 0 / 48%);
      --thread-muted: #b7c1b8;
      --thread-active: #29342b;
      --hover: rgb(255 255 255 / 6%);
      --surface-raised: #252c26;
      --surface-code: #202722;
      --user-border: #3e5943;
      --user-ink: #e0ebe1;
      --assistant-ink: #d2dad3;
      --field-label: #bdc7be;
      --field-hint: #9da99e;
      --placeholder: #8d998f;
      --focus-border: #8ebd95;
      --focus-ring: rgb(142 189 149 / 19%);
      --composer-focus-border: #8ebd95;
      --composer-focus-ring: rgb(142 189 149 / 17%);
      --button-surface: #252c26;
      --button-ink: #dbe4dc;
      --settings-ink: #c4cec5;
      --icon-ink: #aeb9b0;
      --error-surface: #321f1d;
      --error-border: #68403a;
      --modal-backdrop: rgb(0 0 0 / 64%);
      --modal-border: rgb(255 255 255 / 8%);
      --modal-footer: #191f1a;
      --toast-surface: #252c26;
      --toast-ink: #e1e8e2;
      --topbar-surface: rgb(29 35 30 / 88%);
      --composer-shadow: 0 3px 18px rgb(0 0 0 / 24%);
      --toast-shadow: 0 8px 24px rgb(0 0 0 / 32%);
      --sidebar-shadow: 12px 0 32px rgb(0 0 0 / 35%);
      --scrim: rgb(0 0 0 / 48%);
      --status-offline: #667168;
      --status-online: #55b678;
      --status-busy: #d7a34c;
      --stop-background: #58655a;
      --disabled-opacity: .62;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; height: 100vh; color: var(--ink); background: var(--page); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: var(--disabled-opacity); }
    button:focus-visible, .thread-select:focus-visible { outline: 2px solid var(--focus-border); outline-offset: 2px; }
    .app { display: flex; width: 100%; height: 100%; overflow: hidden; }
    .sidebar { width: 250px; flex: 0 0 250px; display: flex; flex-direction: column; padding: 18px 13px 14px; background: var(--sidebar); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 1px 7px 20px; font-size: 14px; font-weight: 650; letter-spacing: 0; }
    .brand-mark { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: white; background: var(--accent-action); }
    .brand-mark svg { width: 15px; height: 15px; }
    .new-chat { display: flex; align-items: center; justify-content: flex-start; gap: 9px; width: 100%; height: 39px; padding: 0 11px; color: var(--ink); background: transparent; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 13px; }
    .new-chat:hover, .icon-button:hover, .thread:hover { background: var(--hover); }
    .new-chat svg { width: 16px; height: 16px; color: var(--muted); }
    .side-label { padding: 24px 9px 9px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .thread-list { display: flex; flex: 1; flex-direction: column; gap: 3px; min-height: 0; overflow-y: auto; }
    .thread { position: relative; display: flex; align-items: center; min-height: 36px; border-radius: 7px; color: var(--thread-muted); font-size: 12px; }
    .thread.active { background: var(--thread-active); color: var(--ink); }
    .thread-select { min-width: 0; flex: 1; min-height: 36px; padding: 0 9px; overflow: hidden; border: 0; border-radius: 7px; background: transparent; color: inherit; text-align: left; font-size: 12px; }
    .thread-select:hover { background: var(--hover); }
    .thread-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-remove { display: none; flex: 0 0 26px; margin-left: auto; width: 26px; height: 26px; padding: 5px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
    .thread:hover .thread-remove, .thread-remove:focus-visible { display: grid; place-items: center; }
    .thread-remove:hover { color: var(--danger); background: var(--button-surface); }
    .thread-remove svg { width: 14px; height: 14px; }
    .sidebar-bottom { border-top: 1px solid var(--line); padding-top: 12px; }
    .connection { display: flex; align-items: center; gap: 8px; padding: 7px 9px 11px; color: var(--muted); font-size: 11px; }
    .status-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--status-offline); }
    .status-dot.online { background: var(--status-online); }
    .status-dot.busy { background: var(--status-busy); }
    .settings-button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px; border: 0; border-radius: 7px; background: transparent; color: var(--settings-ink); text-align: left; font-size: 12px; }
    .settings-button:hover { background: var(--hover); }
    .settings-button svg { width: 17px; height: 17px; color: var(--muted); }
    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .topbar { height: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid var(--line); background: var(--topbar-surface); }
    .top-title { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
    .mobile-menu { display: none !important; }
    .top-actions { min-width: 0; display: flex; align-items: center; gap: 8px; }
    .top-actions .icon-button { flex: 0 0 32px; }
    .top-model { min-width: 0; flex: 0 1 auto; max-width: min(36vw, 290px); overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .icon-button { width: 32px; height: 32px; display: grid; place-items: center; padding: 7px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--icon-ink); }
    .icon-button svg { width: 17px; height: 17px; }
    .conversation { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
    .message-column { width: min(790px, calc(100% - 48px)); margin: 0 auto; padding: 34px 0 24px; }
    .empty-state { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 0 52px; text-align: center; }
    .empty-mark { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--accent); }
    .empty-mark svg { width: 21px; height: 21px; }
    .empty-state h1 { margin: 17px 0 0; font-size: 19px; font-weight: 550; }
    .empty-state p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .message { display: flex; gap: 12px; margin: 0 0 26px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }
    .message-avatar { width: 27px; height: 27px; flex: 0 0 27px; display: grid; place-items: center; margin-top: 1px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--accent); }
    .message-avatar svg { width: 14px; height: 14px; }
    .message-body { max-width: min(690px, calc(100% - 42px)); min-width: 0; color: var(--assistant-ink); font-size: 13px; line-height: 1.75; overflow-wrap: anywhere; }
    .message.user .message-body { max-width: min(620px, calc(100% - 20px)); padding: 10px 14px; border: 1px solid var(--user-border); border-radius: 12px 12px 3px 12px; background: var(--accent-soft); color: var(--user-ink); }
    .message.error .message-body { color: var(--danger); }
    .message-body p { margin: 0 0 10px; }
    .message-body > :last-child { margin-bottom: 0; }
    .message-body h1, .message-body h2, .message-body h3, .message-body h4 { margin: 15px 0 7px; color: var(--ink); line-height: 1.4; font-weight: 650; }
    .message-body h1 { font-size: 18px; }
    .message-body h2 { font-size: 16px; }
    .message-body h3 { font-size: 14px; }
    .message-body h4 { font-size: 13px; }
    .message-body h5, .message-body h6 { font-size: 12px; }
    .message-body ul, .message-body ol { margin: 6px 0 11px; padding-left: 23px; }
    .message-body li + li { margin-top: 3px; }
    .message-body input[type="checkbox"] { margin: 0 6px 0 -17px; accent-color: var(--accent-action); vertical-align: middle; }
    .message-body blockquote { margin: 9px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line-strong); color: var(--muted); }
    .message-body blockquote > :last-child { margin-bottom: 0; }
    .message-body hr { margin: 13px 0; border: 0; border-top: 1px solid var(--line-strong); }
    .message-body a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .message-body table { display: block; width: max-content; max-width: 100%; overflow-x: auto; margin: 9px 0 12px; border-collapse: collapse; font-size: 12px; }
    .message-body th, .message-body td { min-width: 64px; padding: 5px 9px; border: 1px solid var(--line-strong); text-align: left; }
    .message-body th { background: var(--surface-raised); color: var(--ink); font-weight: 600; }
    .message-body img { display: block; max-width: 100%; max-height: 420px; margin: 9px 0; border-radius: 6px; object-fit: contain; }
    .message-body code { padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-raised); font-family: Consolas, monospace; font-size: 12px; }
    .message-body pre { max-width: 100%; overflow-x: auto; margin: 8px 0; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-code); font-family: Consolas, monospace; font-size: 12px; line-height: 1.6; white-space: pre; }
    .message-body pre code { padding: 0; border: 0; background: none; }
    .message-sources { width: 100%; margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
    .message-sources-title { margin: 0 0 5px; color: var(--field-hint); font-size: 10px; }
    .message-source-list { display: flex; flex-wrap: wrap; gap: 5px 10px; }
    .message-source { max-width: 100%; display: inline-flex; align-items: center; gap: 5px; color: var(--button-ink); font-size: 10px; text-decoration: none; }
    .message-source:hover { color: var(--accent); text-decoration: underline; }
    .message-source svg { width: 11px; height: 11px; flex: 0 0 11px; }
    .composer-wrap { padding: 12px 24px 20px; }
    .composer { width: min(790px, 100%); margin: 0 auto; padding: 10px 11px 8px 14px; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--panel); box-shadow: var(--composer-shadow); }
    .composer:focus-within { border-color: var(--composer-focus-border); box-shadow: 0 0 0 3px var(--composer-focus-ring); }
    .prompt { display: block; width: 100%; min-height: 30px; max-height: 160px; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 13px; line-height: 1.6; }
    .prompt::placeholder { color: var(--placeholder); }
    .composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 7px; }
    .composer-model { position: relative; display: flex; min-width: 0; align-items: center; gap: 6px; color: var(--muted); }
    .composer-model svg { width: 14px; height: 14px; flex: 0 0 14px; }
    .composer-model #modelSelect { display: none; }
    .model-menu-trigger { min-width: 0; max-width: min(45vw, 300px); display: inline-flex; align-items: center; gap: 6px; padding: 4px 5px 4px 1px; border: 0; border-radius: 5px; background: transparent; color: var(--button-ink); font-size: 11px; text-align: left; }
    .model-menu-trigger:hover:not(:disabled), .model-menu-trigger[aria-expanded="true"] { color: var(--ink); }
    .model-menu-trigger:focus-visible, .web-search-toggle:focus-visible { outline: 2px solid var(--focus-border); outline-offset: 2px; }
    .model-menu-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-menu-chevron { width: 12px !important; height: 12px !important; flex: 0 0 12px !important; transition: transform .15s ease; }
    .model-menu-trigger[aria-expanded="true"] .model-menu-chevron { transform: rotate(180deg); }
    .model-menu { position: absolute; z-index: 9; left: -5px; bottom: calc(100% + 9px); width: min(300px, calc(100vw - 36px)); max-height: min(340px, 50vh); overflow: auto; padding: 5px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .model-menu[hidden] { display: none; }
    .model-menu-option { width: 100%; min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 9px; border: 0; border-radius: 5px; background: transparent; color: var(--button-ink); font-size: 11px; text-align: left; }
    .model-menu-option:hover, .model-menu-option:focus-visible { outline: 0; background: var(--hover); color: var(--ink); }
    .model-menu-option[aria-selected="true"] { color: var(--accent); }
    .model-menu-option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-menu-option svg { width: 14px !important; height: 14px !important; flex: 0 0 14px !important; }
    .composer-actions { display: flex; align-items: center; gap: 6px; }
    .web-search-toggle { width: 29px; height: 29px; flex: 0 0 29px; display: grid; place-items: center; padding: 6px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); }
    .web-search-toggle:hover { background: var(--hover); color: var(--button-ink); }
    .web-search-toggle[aria-pressed="true"] { border-color: var(--focus-border); background: var(--accent-soft); color: var(--accent); }
    .web-search-toggle svg { width: 16px; height: 16px; }
    .send-button { width: 31px; height: 31px; flex: 0 0 31px; display: grid; place-items: center; padding: 7px; border: 0; border-radius: 8px; background: var(--accent-action); color: white; }
    .send-button:hover:not(:disabled) { background: var(--accent-action-hover); }
    .send-button svg { width: 16px; height: 16px; }
    .send-button.stop { background: var(--stop-background); }
    .composer-status { width: min(790px, 100%); min-height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 5px auto 0; }
    .composer-note { min-width: 0; margin: 0; color: var(--field-hint); text-align: left; font-size: 10px; }
    .context-control { position: relative; flex: 0 0 auto; }
    .context-button { min-height: 25px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .context-button:hover, .context-button[aria-expanded="true"] { border-color: var(--line); background: var(--panel); color: var(--ink); }
    .context-button:focus-visible { outline: 2px solid var(--focus-border); outline-offset: 2px; }
    .context-ring { width: 15px; height: 15px; flex: 0 0 15px; overflow: visible; transform: rotate(-90deg); }
    .context-ring circle { fill: none; stroke-width: 3; }
    .context-ring-track { stroke: var(--line-strong); }
    .context-ring-value { stroke: var(--accent); stroke-dasharray: 50.27; stroke-dashoffset: 50.27; stroke-linecap: round; transition: stroke-dashoffset .2s ease; }
    .context-button.has-usage { color: var(--button-ink); }
    .context-popover { position: absolute; z-index: 8; right: 0; bottom: calc(100% + 9px); width: min(300px, calc(100vw - 24px)); padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); box-shadow: var(--shadow); color: var(--ink); }
    .context-popover[hidden] { display: none; }
    .context-popover-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }
    .context-popover-head strong { font-weight: 650; }
    .context-percent { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .context-total { margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .context-meter { height: 5px; margin-top: 10px; overflow: hidden; border-radius: 99px; background: var(--surface-raised); }
    .context-meter-value { width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .2s ease; }
    .context-detail { display: grid; gap: 8px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
    .context-detail-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; color: var(--field-label); font-size: 10px; }
    .context-detail-row span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .context-detail-row span:last-child { flex: 0 0 auto; color: var(--button-ink); font-variant-numeric: tabular-nums; text-align: right; }
    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: var(--modal-backdrop); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(480px, 100%); min-width: 0; max-height: min(760px, calc(100vh - 40px)); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--modal-border); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
    .model-picker-backdrop { z-index: 12; }
    .model-picker-modal { width: min(560px, 100%); }
    .modal > form { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .modal-content { min-width: 0; overflow-y: auto; padding: 17px 20px; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 15px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; color: var(--field-label); font-size: 11px; font-weight: 600; }
    .field-label > label { cursor: pointer; }
    .field-label .subtle-button { height: 28px; padding: 0 9px; border-radius: 6px; font-size: 10px; }
    .reasoning-model-label { max-width: 58%; overflow: hidden; color: var(--field-hint); font-size: 10px; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
    .field input, .field select { width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 7px; outline: none; background: var(--panel); font-size: 12px; }
    .field input:focus, .field select:focus { border-color: var(--focus-border); box-shadow: 0 0 0 3px var(--focus-ring); }
    .field small { color: var(--field-hint); font-size: 10px; }
    .reasoning-options-editor { display: grid; gap: 7px; margin-top: -1px; padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-raised); }
    .reasoning-options-editor[hidden] { display: none; }
    .reasoning-options-editor-label { color: var(--field-label); font-size: 10px; font-weight: 600; }
    .reasoning-options-row { display: flex; min-width: 0; gap: 7px; }
    .reasoning-options-row input { min-width: 0; flex: 1; height: 32px; padding: 0 9px; background: var(--panel); font-size: 11px; }
    .reasoning-options-row .subtle-button { height: 32px; padding: 0 9px; font-size: 10px; }
    .reasoning-options-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .reasoning-options-actions small { min-width: 0; line-height: 1.4; }

    .model-picker-search:focus { border-color: var(--focus-border); box-shadow: 0 0 0 3px var(--focus-ring); }
    .model-picker-tools { min-height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--field-hint); font-size: 10px; }
    .model-picker-select-all { display: inline-flex; min-width: 0; align-items: center; gap: 7px; color: var(--field-label); cursor: pointer; }
    .model-picker-select-all input, .model-option input { width: 15px; height: 15px; flex: 0 0 15px; margin: 0; accent-color: var(--accent-action); }
    .model-picker-count { flex: 0 0 auto; font-variant-numeric: tabular-nums; }

    .model-option { min-width: 0; min-height: 39px; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .model-option:last-child { border-bottom: 0; }
    .model-option:hover { background: var(--hover); }
    .model-option-main { min-width: 0; flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .model-option-id { min-width: 0; overflow: hidden; color: var(--button-ink); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .model-option-context, .model-option-reasoning { flex: 0 0 auto; color: var(--field-hint); font-size: 10px; font-variant-numeric: tabular-nums; }
    .model-option-reasoning { max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-picker-empty { padding: 26px 12px; color: var(--field-hint); text-align: center; font-size: 11px; }
    .model-picker-error { margin: 0; }
    .form-error { display: none; margin: 2px 0 11px; padding: 9px 10px; border: 1px solid var(--error-border); border-radius: 7px; background: var(--error-surface); color: var(--danger); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .form-error.visible { display: block; }
    .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--modal-footer); }
    .button { min-width: 74px; height: 34px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--button-surface); color: var(--button-ink); font-size: 11px; }

    .toast { position: fixed; z-index: 20; left: 50%; bottom: 24px; max-width: calc(100vw - 32px); padding: 10px 14px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; border: 1px solid var(--line); border-radius: 8px; background: var(--toast-surface); box-shadow: var(--toast-shadow); color: var(--toast-ink); font-size: 11px; transition: opacity .18s, transform .18s; }

  <script>
    (() => {
      const CONFIG_KEY = 'minimal-ai-chat.config.v1';
      const THREADS_KEY = 'minimal-ai-chat.threads.v1';
      const CURRENT_KEY = 'minimal-ai-chat.current.v1';
      const defaults = { apiKey: '', searchApiKey: '', apiUrl: '', searchApiUrl: '', searchApiUrlExplicit: false, protocol: 'chat', model: '', reasoning: '', reasoningByModel: {}, persistKey: false, webSearchEnabled: false, models: [], availableModels: [], modelContextLengths: {}, modelReasoningOptions: {}, modelSelectionVersion: 0 };
      const OFFICIAL_SEARCH_API_URL = 'https://api.deepseek.com/anthropic/v1';
      const COMMON_REASONING_OPTIONS = ['minimal', 'low', 'medium', 'high', 'xhigh', 'max', 'ultra', 'off'];
      const $ = (id) => document.getElementById(id);
      const volatileStorage = new Map();
      const storage = {
        getItem(key) {
          try { return localStorage.getItem(key) ?? volatileStorage.get(key) ?? null; }
          catch { return volatileStorage.get(key) ?? null; }
        },
        setItem(key, value) {
          volatileStorage.set(key, String(value));
          try { localStorage.setItem(key, String(value)); } catch { /* Keep this session usable when storage is blocked. */ }
        }
      };
      const state = {
        config: { ...defaults, ...readStorage(CONFIG_KEY, defaults) },
        threads: readStorage(THREADS_KEY, []),
        currentId: storage.getItem(CURRENT_KEY) || '',
        controller: null,
        toastTimer: 0
      };
      if (!Array.isArray(state.config.models)) state.config.models = [];
      state.config.models = [...new Set(state.config.models.filter((model) => typeof model === 'string' && model))];
      if (!Array.isArray(state.config.availableModels)) state.config.availableModels = [...state.config.models];
      else state.config.availableModels = [...new Set(state.config.availableModels.filter((model) => typeof model === 'string' && model))];
      if (!state.config.modelContextLengths || typeof state.config.modelContextLengths !== 'object' || Array.isArray(state.config.modelContextLengths)) state.config.modelContextLengths = {};
      if (!state.config.reasoningByModel || typeof state.config.reasoningByModel !== 'object' || Array.isArray(state.config.reasoningByModel)) state.config.reasoningByModel = {};
      if (!state.config.modelReasoningOptions || typeof state.config.modelReasoningOptions !== 'object' || Array.isArray(state.config.modelReasoningOptions)) state.config.modelReasoningOptions = {};
      const configuredSearchUrl = typeof state.config.searchApiUrl === 'string' ? state.config.searchApiUrl.trim() : '';
      if (!state.config.searchApiUrlExplicit) {
        const officialChatUrl = isOfficialDeepSeekUrl(state.config.apiUrl);
        state.config.searchApiUrlExplicit = Boolean(configuredSearchUrl && (configuredSearchUrl !== OFFICIAL_SEARCH_API_URL || officialChatUrl));
        if (!state.config.searchApiUrlExplicit) state.config.searchApiUrl = '';
      }
      if (!state.config.persistKey) {
        state.config.apiKey = '';
        state.config.searchApiKey = '';
      }
      let modelCatalog = {
        apiUrl: state.config.apiUrl,
        protocol: state.config.protocol,
        models: [...state.config.models],
        availableModels: [...state.config.availableModels],
        modelContextLengths: { ...state.config.modelContextLengths },
        reasoningOptionsByModel: { ...state.config.modelReasoningOptions }
      };
      let pendingModelCatalog = null;
      let pickerSelection = new Set();
      let draftReasoningByModel = {};
      let draftReasoningOptionsByModel = {};
      const icons = {
        assistant: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M5.64 5.64l2.83 2.83m7.06 7.06 2.83 2.83m0-12.72-2.83 2.83m-7.06 7.06-2.83 2.83"/><circle cx="12" cy="12" r="3.2"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg>',
        send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>',
        stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
        moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1z"/></svg>',
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'
      };

      function readStorage(key, fallback) {
        try { const value = JSON.parse(storage.getItem(key)); return value ?? fallback; }
        catch { return fallback; }
      }
      function isOfficialDeepSeekUrl(value) {
        try {
          const url = new URL(value);
          return url.hostname === 'api.deepseek.com' || url.hostname.endsWith('.deepseek.com');
        } catch { return false; }
      }

      $('mobileScrim').addEventListener('click', closeMobileSidebar);
      const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const followSystemTheme = (event) => {
        if (document.documentElement.dataset.themeSource === 'system') setTheme(event.matches ? 'dark' : 'light', 'system');
      };
      if (colorScheme.addEventListener) colorScheme.addEventListener('change', followSystemTheme);
      else colorScheme.addListener(followSystemTheme);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (!$('contextPopover').hidden) {
            setContextPopoverOpen(false);
            $('contextButton').focus();
          }
          closeSettings();
          closeMobileSidebar();
        }
      });

      if (!currentThread() && state.threads.length) {
        state.currentId = state.threads[0].id;
        storage.setItem(CURRENT_KEY, state.currentId);
      }
      setupComposerControls();
      setTheme(document.documentElement.dataset.theme, document.documentElement.dataset.themeSource);
      render();
      if (!state.config.apiKey || !state.config.apiUrl) openSettings();
    })();
  </script>
</body>
</html>
